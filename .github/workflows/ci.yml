name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Build frontend image and validate nginx config
        if: ${{ hashFiles('server/**') == '' }}
        run: |
          docker build -t peng-web:ci .
          docker run --rm --entrypoint nginx peng-web:ci -t
      - name: Build and smoke test the Compose stack
        if: ${{ hashFiles('server/**') != '' }}
        run: |
          docker compose up --build -d --wait --wait-timeout 120
          url="http://$(docker compose port web 8080)"
          curl --fail --silent --show-error --max-time 10 "$url/" | grep -F 'id="root"'
          curl --fail --silent --show-error --max-time 10 "$url/healthz"
      - name: Show Compose logs
        if: ${{ failure() && hashFiles('server/**') != '' }}
        run: docker compose logs
      - name: Remove CI containers and volume
        if: ${{ always() && hashFiles('server/**') != '' }}
        run: docker compose down --volumes
