# Resolve the Compose service again when Docker replaces the server container.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream peng_server {
    zone peng_server 64k;
    server server:3000 resolve;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /api/ {
        proxy_pass http://peng_server;
    }

    location = /mcp {
        # nginx passes MCP request and response headers through by default.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;

        proxy_pass http://peng_server;
    }

    location = /healthz {
        proxy_pass http://peng_server;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
